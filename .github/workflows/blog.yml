name: Publicar artigo SEO no blog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas testar a pauta sem publicar'
        required: false
        default: false
        type: boolean
      topic:
        description: 'Slug ou título da pauta (opcional)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: publicar-artigo-blog
  cancel-in-progress: false

jobs:
  gerar-artigo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site original
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar artigo e atualizar o blog existente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${{ github.event.inputs.topic || '' }}" ]; then args+=(--topic "${{ github.event.inputs.topic }}"); fi
          python scripts/gerar_artigo.py "${args[@]}"

      - name: Publicar alterações
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artigos blog/index.html data sitemap.xml scripts/gerar_artigo.py
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
          else
            git commit -m 'content: publicar novo artigo SEO'
            git push
          fi
