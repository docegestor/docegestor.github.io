name: Publicar artigo SEO no blog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente testar a pauta, sem chamar a IA nem alterar arquivos'
        required: false
        default: false
        type: boolean
      topic:
        description: 'Slug da pauta opcional; deixe vazio para escolher a próxima pendente'
        required: false
        default: ''
        type: string
  schedule:
    # 09:00 no horário de Brasília (12:00 UTC). O GitHub Actions usa UTC.
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: publicar-artigo-seo
  cancel-in-progress: false

jobs:
  gerar-artigo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Executar gerador
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TOPIC: ${{ inputs.topic || '' }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
          python scripts/gerar_artigo.py "${args[@]}"

      - name: Commitar e publicar alterações
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git config user.name "docegestor-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artigos blog/index.html data/pautas.json data/artigos_automatizados.json sitemap.xml
          git commit -m "content: publicar novo artigo SEO"
          git push
