name: Publicar artigo estático no blog

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Quantidade de artigos revisados para publicar (0 a 3)'
        required: false
        default: '1'
        type: string
  schedule:
    # 09h de Brasília em dias úteis; o conteúdo vem da fila local revisada.
    - cron: '0 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: publicar-artigo-blog
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publicar artigo revisado em /blog
        env:
          PUBLISH_LIMIT: ${{ inputs.limit || '1' }}
        run: |
          set -euo pipefail
          limit="$PUBLISH_LIMIT"
          if ! [[ "$limit" =~ ^[0-3]$ ]]; then
            echo 'O limite deve ser um número entre 0 e 3.' >&2
            exit 1
          fi
          python scripts/publicar_artigo_estatico.py --limit "$limit"

      - name: Salvar página no repositório
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog data/artigos_publicados_estaticos.json sitemap.xml scripts/publicar_artigo_estatico.py
          if git diff --cached --quiet; then
            echo 'Nenhum artigo revisado aguardando publicação.'
          else
            git commit -m 'content: publicar artigo estático no blog'
            git push
          fi
