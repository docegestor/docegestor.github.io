name: Gerar e publicar artigo no blog

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema opcional; se vazio, usa a próxima pauta pendente'
        required: false
        type: string
      category:
        description: 'Categoria opcional do artigo'
        required: false
        default: 'Gestão financeira'
        type: choice
        options:
          - Receitas e produtos
          - Precificação
          - Organização de encomendas
          - Gestão financeira
          - Vendas e marketing
  schedule:
    # 07h de Brasília (10h UTC), todos os dias.
    - cron: '0 10 * * *'

permissions:
  contents: write

concurrency:
  group: publicar-artigo-blog
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar artigo estruturado com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-2.5-flash,gemini-2.0-flash-lite
          TOPIC: ${{ inputs.topic || '' }}
          CATEGORY: ${{ inputs.category || 'Gestão financeira' }}
        run: |
          set -euo pipefail
          if [ -n "$TOPIC" ]; then
            python scripts/gerar_artigo.py --topic "$TOPIC" --category "$CATEGORY"
          else
            python scripts/gerar_artigo.py --category "$CATEGORY"
          fi

      - name: Formatar e publicar dentro de /blog
        run: |
          set -euo pipefail
          python scripts/publicar_artigo_estatico.py --limit 1

      - name: Salvar página no repositório
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog data/artigos_pendentes.json data/artigos_publicados_estaticos.json sitemap.xml favicon.svg README-AUTOMACAO-BLOG.md scripts/gerar_artigo.py scripts/publicar_artigo_estatico.py
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
          else
            git commit -m 'content: publicar artigo estático no blog'
            git push
          fi
